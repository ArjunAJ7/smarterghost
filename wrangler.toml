name = "smarterghost"
main = "src/worker.ts"
compatibility_date = "2026-10-31"

# Static assets served directly by Cloudflare's edge
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Workers AI binding (free tier)
[ai]
binding = "AI"

# Workers KV namespace — placeholder IDs filled at deploy time
[[kv_namespaces]]
binding = "GHOST_KV"
id = "c00d234cef3948c991f0511b4331c526"
